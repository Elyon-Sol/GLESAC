<svg viewBox="0 0 880 632" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
<title>GLESAC communication and configuration overview (P3)</title>
<desc>GLESAC on the operator machine reads local JSONL logs and files, invokes Elyon-Sol CLIs as subprocesses, appends to a local console-audit log, and makes read-only HTTPS probes to four public nodes.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect x="0" y="0" width="880" height="632" fill="#ffffff"/>
<text x="16" y="24" font-size="15" font-weight="700" fill="#1a1a1a">GLESAC — communication &amp; configuration (P3, current)</text>
<g font-size="10.5" fill="#666666">
<line x1="500" y1="20" x2="524" y2="20" stroke="#3b82f6" stroke-width="2"/><text x="529" y="24">local read</text>
<line x1="596" y1="20" x2="620" y2="20" stroke="#d97706" stroke-width="2"/><text x="625" y="24">invoke / append</text>
<line x1="716" y1="20" x2="740" y2="20" stroke="#888888" stroke-width="2" stroke-dasharray="5 4"/><text x="745" y="24">network (read-only)</text>
</g>
<rect x="16" y="44" width="564" height="436" rx="10" fill="none" stroke="#c9c9c9" stroke-dasharray="7 5"/>
<text x="30" y="63" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#777777">OPERATOR MACHINE - TRUST BOUNDARY</text>
<rect x="222" y="76" width="190" height="186" rx="8" fill="#f3f3f2" stroke="#c9c9c9"/>
<text x="317" y="94" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a1a">GLESAC</text>
<rect x="234" y="102" width="166" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="317" y="122" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a1a">glesac run - web console</text>
<text x="317" y="137" font-size="10" text-anchor="middle" fill="#666666">127.0.0.1:8181 - GET-only</text>
<rect x="234" y="164" width="166" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="317" y="184" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a1a">glesac CLI</text>
<text x="317" y="199" font-size="10" text-anchor="middle" fill="#666666">status - logs - trace - pending</text>
<text x="317" y="248" font-size="10" font-style="italic" text-anchor="middle" fill="#d97706">no signing primitive (SoD)</text>
<rect x="40" y="102" width="120" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="100" y="123" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a1a">Browser</text>
<text x="100" y="138" font-size="10" text-anchor="middle" fill="#666666">dashboard, read-only</text>
<line x1="160" y1="128" x2="230" y2="128" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="195" y="120" font-size="9.5" text-anchor="middle" fill="#666666">HTTP GET</text>
<rect x="40" y="170" width="136" height="40" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="108" y="188" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">envelope_inspector</text>
<text x="108" y="202" font-size="9.5" text-anchor="middle" fill="#666666">inspect - reevaluate - reconcile</text>
<rect x="40" y="220" width="136" height="52" rx="6" fill="#ffffff" stroke="#d97706"/>
<text x="108" y="240" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">approver_cli</text>
<text x="108" y="255" font-size="9.5" text-anchor="middle" fill="#666666">approver key custody</text>
<line x1="234" y1="184" x2="180" y2="188" stroke="#d97706" stroke-width="1.8" marker-end="url(#aa)"/>
<line x1="234" y1="204" x2="180" y2="238" stroke="#d97706" stroke-width="1.8" marker-end="url(#aa)"/>
<text x="207" y="228" font-size="9.5" text-anchor="middle" fill="#666666">invoke</text>
<rect x="40" y="306" width="384" height="130" rx="8" fill="#f3f3f2" stroke="#c9c9c9"/>
<text x="56" y="325" font-size="10.5" font-weight="700" letter-spacing="1" fill="#777777">ELYON-SOL DATA - READ-ONLY FILES</text>
<g font-size="10.5" font-family="ui-monospace, monospace" fill="#1a1a1a">
<rect x="56" y="336" width="130" height="34" rx="5" fill="#ffffff" stroke="#c9c9c9"/><text x="121" y="357" text-anchor="middle">issuance.log</text>
<rect x="196" y="336" width="130" height="34" rx="5" fill="#ffffff" stroke="#c9c9c9"/><text x="261" y="357" text-anchor="middle">approval.log</text>
<rect x="56" y="380" width="130" height="34" rx="5" fill="#ffffff" stroke="#c9c9c9"/><text x="121" y="401" text-anchor="middle">readiness.json</text>
<rect x="196" y="380" width="130" height="34" rx="5" fill="#ffffff" stroke="#c9c9c9"/><text x="261" y="401" text-anchor="middle">signed record</text>
</g>
<line x1="290" y1="262" x2="252" y2="306" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="248" y="288" font-size="9.5" text-anchor="end" fill="#666666">JSONL / JSON reads</text>
<rect x="440" y="336" width="126" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
<text x="503" y="358" font-size="10.5" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle" fill="#1a1a1a">console_audit</text>
<text x="503" y="374" font-size="9.5" text-anchor="middle" fill="#666666">approve / deny record</text>
<line x1="380" y1="262" x2="480" y2="336" stroke="#d97706" stroke-width="1.8" marker-end="url(#aa)"/>
<text x="448" y="294" font-size="9.5" fill="#666666">append</text>
<rect x="614" y="64" width="250" height="304" rx="10" fill="#f3f3f2" stroke="#c9c9c9"/>
<text x="630" y="86" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#777777">PUBLIC NODES - elyon-sol.io</text>
<g font-size="12" font-weight="600" fill="#1a1a1a">
<rect x="632" y="98" width="214" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="739" y="119" text-anchor="middle">gate :8443</text>
<text x="739" y="134" font-size="9.5" font-weight="400" text-anchor="middle" fill="#666666">/governed-call - 202 holds</text>
<rect x="632" y="160" width="214" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="739" y="181" text-anchor="middle">target :9443</text>
<text x="739" y="196" font-size="9.5" font-weight="400" text-anchor="middle" fill="#666666">/received - executed count</text>
<rect x="632" y="222" width="214" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="739" y="243" text-anchor="middle">authz :9243</text>
<text x="739" y="258" font-size="9.5" font-weight="400" text-anchor="middle" fill="#666666">/healthz</text>
<rect x="632" y="284" width="214" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
<text x="739" y="305" text-anchor="middle">publisher :9143</text>
<text x="739" y="320" font-size="9.5" font-weight="400" text-anchor="middle" fill="#666666">signed record - 5-min TTL</text>
</g>
<line x1="412" y1="140" x2="614" y2="140" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ab)"/>
<text x="513" y="132" font-size="9.5" text-anchor="middle" fill="#666666">HTTPS GET probes - read-only</text>
<path d="M108,272 V456 H739 V372" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aa)"/>
<text x="430" y="450" font-size="9.5" text-anchor="middle" fill="#d97706">signed grant - operator presents to gate (X-Elyon-Sol-Approval-Grant)</text>
<rect x="440" y="180" width="126" height="60" rx="6" fill="#ffffff" stroke="#d97706"/>
<text x="503" y="200" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">runbooks</text>
<text x="503" y="214" font-size="9" text-anchor="middle" fill="#666666">rotate-publisher-key</text>
<text x="503" y="226" font-size="9" text-anchor="middle" fill="#666666">renew-certs</text>
<line x1="412" y1="200" x2="436" y2="204" stroke="#d97706" stroke-width="1.8" marker-end="url(#aa)"/>
<rect x="16" y="496" width="848" height="122" rx="10" fill="#f3f3f2" stroke="#c9c9c9"/>
<text x="32" y="517" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#777777">CONFIGURATION - ENV VARS (captured at process start)</text>
<g font-size="10" font-family="ui-monospace, monospace" fill="#1a1a1a">
<text x="32" y="537" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" fill="#666666">Data paths</text>
<text x="32" y="553">GLESAC_ISSUANCE_LOG</text>
<text x="32" y="567">GLESAC_APPROVAL_LOG</text>
<text x="32" y="581">GLESAC_READINESS</text>
<text x="32" y="595">GLESAC_SIGNED_RECORD</text>
<text x="32" y="609">GLESAC_CONSOLE_AUDIT</text>
<text x="310" y="537" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" fill="#666666">Node probes &amp; core</text>
<text x="310" y="553">GLESAC_GATE_URL</text>
<text x="310" y="567">GLESAC_TARGET_URL</text>
<text x="310" y="581">GLESAC_AUTHZ_URL - GLESAC_PUB_URL</text>
<text x="310" y="595">ELYON_SOL_HOME</text>
<text x="310" y="609">GLESAC_CLOCK_SKEW_SECONDS</text>
<text x="600" y="537" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" fill="#666666">Custody &amp; checks</text>
<text x="600" y="553">ELYON_APPROVER_KEY_HEX / _ID</text>
<text x="600" y="567" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" fill="#666666">approver_cli env - never GLESAC</text>
<text x="600" y="587">GLESAC_LIVE_NODES=1</text>
<text x="600" y="601" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" fill="#666666">opt-in live-node suite</text>
</g>
</svg>
